# Netlify 构建与部署（覆盖 Netlify 后台里旧的 Hexo 构建设置）
[build]
  command = "npm run build"
  publish = ".tio2-tmp/site"

[build.environment]
  NODE_VERSION = "22.22.3"

# 旧 Hexo 站点的链接 → TiO₂ 新地址（301 永久重定向）

[[redirects]]
  from = "/test1"
  to = "/posts/test1.html"
  status = 301

[[redirects]]
  from = "/test1/*"
  to = "/posts/test1.html"
  status = 301

