</svg><svg x="545.0" y="38.5" width="380.0" height="220.0" viewBox="0 0 380 220"><defs></defs><text x="10" y="34.0" font-size="14.5" text-anchor="start" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">• q0 走零条 ε 边：q0 在闭包里</text><text x="10" y="55.025" font-size="14.5" text-anchor="start" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">• q0 →ε q1 →ε q2：都可达</text><text x="10" y="76.05" font-size="14.5" text-anchor="start" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">• q2 →ε q0 形成环：用 seen 集合防止死循环</text><text x="10" y="97.07499999999999" font-size="14.5" text-anchor="start" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">• q3 要读 a 才能到：不在闭包里</text><text x="10" y="118.1" font-size="14.5" text-anchor="start" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">• q4 在 q3 之后：读 a 之后再求一次闭包</text><text x="10" y="139.125" font-size="14.5" text-anchor="start" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">   即 E(move({q0,q1,q2}, a)) = E({q3}) = {q3, q4}</text></svg></svg></svg>