" fill="#203b48">q 读 a 到 r，p 读 a 到 q：aa 区分 p、q</text><text x="30" y="410.0" font-size="14.5" text-anchor="start" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">只做一轮会把 p、q 错误地合并：它们的差别要读两个字符才暴露。</text><text x="30" y="431.025" font-size="14.5" text-anchor="start" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">第 k 轮能发现的，正是长度不超过 k 的区分串。</text></svg></svg>