<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="398" viewBox="0 0 1024 398" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><title>状态数有限：任意深度的括号匹配无法用 DFA 识别</title><rect width="100%" height="100%" rx="18" fill="#f5f2e9"/><text x="512.0" y="38" font-size="22" text-anchor="middle" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48" font-weight="600">状态数有限：任意深度的括号匹配无法用 DFA 识别</text><svg x="12.0" y="56" width="1000.0" height="330.0" viewBox="0 0 1000 330"><defs><marker id="m456579" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 z" fill="#456579"/></marker></defs><circle cx="90" cy="130" r="26" fill="#e2ebe6" stroke="#456579" stroke-width="1.6"/><text x="90" y="135.76" font-size="16" text-anchor="middle" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">s0</text><circle cx="470" cy="130" r="28" fill="#f0dfc1" stroke="#b07a2a" stroke-width="1.6"/><text x="470" y="135.76" font-size="16" text-anchor="middle" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">s</text><circle cx="820" cy="130" r="28" fill="#e2ebe6" stroke="#456579" stroke-width="1.6"/><text x="820" y="135.76" font-size="16" text-anchor="middle" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">t</text><path d="M30,130 L62,130" fill="none" stroke="#456579" stroke-width="1.6" marker-end="url(#m456579)"/><path d="M112,115 C200,20 360,20 448,112" fill="none" stroke="#456579" stroke-width="1.6" marker-end="url(#m456579)"/><text x="280" y="38" font-size="14" text-anchor="middle" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48" stroke="#f5f2e9" stroke-width="4" paint-order="stroke">读 i 个“(”</text><path d="M112,145 C200,240 360,240 448,148" fill="none" stroke="#456579" stroke-width="1.6" marker-end="url(#m456579)"/><text x="280" y="232" font-size="14" text-anchor="middle" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48" stroke="#f5f2e9" stroke-width="4" paint-order="stroke">读 j 个“(”（j &gt; i）</text><path d="M498,130 L790,130" fill="none" stroke="#456579" stroke-width="1.6" marker-end="url(#m456579)"/><text x="644" y="120" font-size="14" text-anchor="middle" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48" stroke="#f5f2e9" stroke-width="4" paint-order="stroke">再读 i 个“)”</text><rect x="640" y="190" width="340" height="80" rx="10" fill="#ffffff" stroke="#456579" stroke-width="1.5"/><text x="810" y="220" font-size="14" text-anchor="middle" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#4f7f4a">i 个“(” + i 个“)”：平衡 → 应接受</text><text x="810" y="250" font-size="14" text-anchor="middle" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#a0574b">j 个“(” + i 个“)”：还缺右括号 → 应拒绝</text><text x="810" y="300" font-size="15" text-anchor="middle" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48" font-weight="600">同一个状态 t 不能既接受又拒绝：矛盾</text><text x="40" y="270.0" font-size="14" text-anchor="start" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">DFA 只有 k 个状态，而前缀 ε、(、((、…、k 个“(”共 k+1 个</text><text x="40" y="290.3" font-size="14" text-anchor="start" font-family="PingFang SC, 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif" fill="#203b48">→ 至少两个前缀落进同一状态 s（抽屉原理）</text></svg></svg>