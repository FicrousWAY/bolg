    <line x1="750" y1="165" x2="786" y2="165"/>
    <line x1="1000" y1="165" x2="1036" y2="165"/>
    <line x1="1145" y1="240" x2="1145" y2="296"/>
    <line x1="1040" y1="375" x2="1004" y2="375"/>
    <line x1="790" y1="375" x2="754" y2="375"/>
    <line x1="540" y1="375" x2="504" y2="375"/>
