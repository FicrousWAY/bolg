<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-label="三片偏振片：每次只留下当前透振轴上的分量"><rect width="960" height="430" rx="18" fill="#ffffff"/><g font-family="LXGW WenKai, PingFang SC, sans-serif" fill="#6b7280">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#6b7280" stroke-width="1.3"/></marker></defs>
<text x="32" y="36" font-size="24" fill="#6b7280" text-anchor="start">三片偏振片：每次只留下当前透振轴上的分量</text>
<text x="32" y="65" font-size="16" fill="#6b7280" text-anchor="start">自然光依次通过 0°、45°、90° 的理想偏振片；三步输出为 I₀/2、I₀/4、I₀/8。</text>
<circle cx="230" cy="220" r="76" stroke="#6b7280" stroke-width="2" fill="none"/>
<path d="M170.0,220.0 L290.0,220.0" fill="none" stroke="#2563eb" stroke-width="5"/>
<text x="230" y="120" font-size="23" fill="#2563eb" text-anchor="middle">0°</text>
<text x="230" y="345" font-size="25" fill="#2563eb" text-anchor="middle">I₀/2</text>
<path d="M320,220 L414,220" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="515" cy="220" r="76" stroke="#6b7280" stroke-width="2" fill="none"/>
<path d="M472.57359312880715,262.42640687119285 L557.4264068711929,177.57359312880715" fill="none" stroke="#2563eb" stroke-width="5"/>
<text x="515" y="120" font-size="23" fill="#2563eb" text-anchor="middle">45°</text>
<text x="515" y="345" font-size="25" fill="#2563eb" text-anchor="middle">I₀/4</text>
<path d="M605,220 L699,220" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<circle cx="800" cy="220" r="76" stroke="#6b7280" stroke-width="2" fill="none"/>
<path d="M800.0,280.0 L800.0,160.0" fill="none" stroke="#2563eb" stroke-width="5"/>
<text x="800" y="120" font-size="23" fill="#2563eb" text-anchor="middle">90°</text>
<text x="800" y="345" font-size="25" fill="#2563eb" text-anchor="middle">I₀/8</text>
<text x="30" y="223" font-size="18" fill="#6b7280" text-anchor="start">自然光 I₀</text>
<path d="M120,220 L145,220" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
<text x="145" y="395" font-size="19" fill="#6b7280" text-anchor="start">每过一片，输入偏振方向随之改变；末片要比较的是 90° − 45°。</text></g></svg>