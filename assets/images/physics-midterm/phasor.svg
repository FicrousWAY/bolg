<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="旋转矢量：相位决定位置和运动方向"><rect width="960" height="470" rx="18" fill="#ffffff"/><g font-family="LXGW WenKai, PingFang SC, sans-serif" fill="#6b7280">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#6b7280" stroke-width="1.3"/></marker></defs>
<text x="32" y="36" font-size="24" fill="#6b7280" text-anchor="start">旋转矢量：相位决定位置和运动方向</text>
<text x="32" y="65" font-size="16" fill="#6b7280" text-anchor="start">取 x = A cosψ；辅助矢量逆时针旋转，质点只沿水平轴往复。</text>
