<text x="300" y="247" font-size="21" fill="#15803d" text-anchor="start">ψ</text>
<text x="325" y="283" font-size="18" fill="#b91c1c" text-anchor="start">x</text>
<text x="365" y="133" font-size="18" fill="#2563eb" text-anchor="start">A</text>
<text x="520" y="130" font-size="21" fill="#2563eb" text-anchor="start">ψ = 0</text>
<text x="520" y="159" font-size="18" fill="#6b7280" text-anchor="start">x = +A，v = 0，a &lt; 0</text>
<text x="520" y="203" font-size="21" fill="#2563eb" text-anchor="start">ψ = π/2</text>
<text x="520" y="232" font-size="18" fill="#6b7280" text-anchor="start">x = 0，v &lt; 0，a = 0</text>
<text x="520" y="276" font-size="21" fill="#2563eb" text-anchor="start">ψ = π</text>
<text x="520" y="305" font-size="18" fill="#6b7280" text-anchor="start">x = −A，v = 0，a &gt; 0</text>
<text x="520" y="349" font-size="21" fill="#2563eb" text-anchor="start">ψ = 3π/2</text>
<text x="520" y="378" font-size="18" fill="#6b7280" text-anchor="start">x = 0，v &gt; 0，a = 0</text></g></svg>